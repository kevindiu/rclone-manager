name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install rclone (verified SHA256)
        run: |
          curl -fsSL https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-amd64.zip -o /tmp/rclone.zip
          curl -fsSL https://downloads.rclone.org/v1.76.0/SHA256SUMS -o /tmp/rclone.sha256
          grep 'rclone-v1.76.0-linux-amd64.zip$' /tmp/rclone.sha256 | sed 's|rclone-v1.76.0-linux-amd64.zip|/tmp/rclone.zip|' | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp/rclone
          sudo mv /tmp/rclone/rclone-v1.76.0-linux-amd64/rclone /usr/local/bin/rclone
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
      - run: go test -race -v ./...

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: rclone-manager:ci
