services:
  rclone-manager:
    # Or pull the prebuilt multi-arch image from GHCR instead of building locally:
    # image: ghcr.io/kevindiu/rclone-manager:main
    build:
      context: .
      args:
        RCLONE_VERSION: "1.76.0"
        APP_VERSION: "1.0.0"
    container_name: rclone-manager
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      RCLONE_MANAGER_LOG_LEVEL: info
      RCLONE_MANAGER_LOG_FORMAT: text
      # Optional headless bootstrap when users table is empty (otherwise UI prompts on first run)
      # RCLONE_MANAGER_ADMIN_USER: admin
      # RCLONE_MANAGER_ADMIN_PASSWORD: change-me-strong-password
      # RCLONE_MANAGER_SESSION_TTL: "168h"
      # Optional comma-separated allowed CORS origins (leave empty for same-origin only)
      # RCLONE_MANAGER_CORS_ORIGINS: "https://backup.example.com"
    volumes:
      - ./config:/config
      # Mount any local directories you want to back up:
      # - /path/to/local/data:/data:ro
