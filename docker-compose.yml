services:
  rclone-manager:
    build:
      context: .
      args:
        RCLONE_VERSION: "1.76.0"
        APP_VERSION: "1.0.0"
    container_name: rclone-manager
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      RCLONE_TIMEZONE: UTC
      RCLONE_DEFAULT_TRANSFERS: "4"
      RCLONE_DEFAULT_CHECKERS: "8"
      RCLONE_DEFAULT_RETRIES: "3"
      RCLONE_DEFAULT_LOW_LEVEL_RETRIES: "10"
      RCLONE_DEFAULT_TIMEOUT: "5m"
      RCLONE_DEFAULT_CONTIMEOUT: "1m"
      RCLONE_LOG_RETENTION_DAYS: "30"
      RCLONE_MAX_CONCURRENT_JOBS: "2"
      RCLONE_MANAGER_LOG_LEVEL: info
      RCLONE_MANAGER_LOG_FORMAT: text
      # Optional comma-separated allowed CORS origins (leave empty for same-origin only)
      # RCLONE_MANAGER_CORS_ORIGINS: "https://backup.example.com"
    volumes:
      - ./config:/config
      # Mount any local directories you want to back up:
      # - /path/to/local/data:/data:ro
